<style>
/* Layout concept: a calm phone app — sand ground, palm-green structure, date-amber for the one thing to press. */
:root{
  --palm:#0F5C4C; --palm-2:#0A4538; --palm-tint:#E2EFEA; --palm-soft:#F0F6F3;
  --date:#E3A23B; --date-2:#C98920; --date-tint:#FBF0DC;
  --sand:#F6F1E8; --card:#FFFFFF; --ink:#13251F; --ink-2:#5B6C66; --ink-3:#8E9B96; --line:#E7E1D6;
  --rose:#C2577A; --rose-tint:#F8E6EC; --sky:#2F7DA8; --sky-tint:#E3F0F7; --clay:#B8613F; --clay-tint:#F7E7DF;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(19,37,31,.05),0 6px 18px rgba(19,37,31,.07);
  --font:'Manrope','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden;margin:0;height:100%;background:var(--sand);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
[dir=rtl] body,[dir=rtl] input,[dir=rtl] textarea{font-family:'IBM Plex Sans Arabic','Manrope',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--date);outline-offset:2px;border-radius:8px}
[dir=rtl] .flip{transform:scaleX(-1)}
.num{font-variant-numeric:tabular-nums}

/* ---------- app shell ---------- */
#root{min-height:100%;display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:480px;min-height:100dvh;background:var(--sand);display:flex;flex-direction:column}
.view{flex:1;padding-bottom:calc(84px + var(--sab));animation:vin .28s cubic-bezier(.2,.8,.2,1)}
.view.no-tabs{padding-bottom:calc(96px + var(--sab))}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar))}

/* desktop demo frame */
.desk .app{max-width:400px;height:min(860px,calc(100dvh - 48px));min-height:0;margin:24px 0;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #10231e,0 30px 80px rgba(16,35,30,.35)}
.desk .app .scroller{flex:1;min-height:0;overflow-y:auto}
.desk #root{align-items:flex-start;background:radial-gradient(circle at 30% 20%,#fff,var(--sand))}
.desk .tabbar,.desk .cta-bar,.desk .sheet-wrap,.desk .toast-box{position:absolute}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) max(16px,var(--sar)) 10px max(16px,var(--sal));background:rgba(246,241,232,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topbar h1{margin:0;font-size:18px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.ibtn{width:42px;height:42px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--shadow);flex:none}
.ibtn:active{transform:scale(.95)}
.ibtn.ghost{background:transparent;box-shadow:none}
.ibtn svg{width:22px;height:22px}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:flex;justify-content:space-around;padding:8px max(10px,var(--sar)) calc(8px + var(--sab)) max(10px,var(--sal));background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);padding:4px 0;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--palm)}
.tab.on::before{content:"";position:absolute;top:-8px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--palm)}
.tab .dot{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--date);color:#3b2600;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ---------- home hero ---------- */
.hero{position:relative;background:linear-gradient(170deg,#12705D 0%,var(--palm) 55%,var(--palm-2) 100%);color:#fff;padding:calc(14px + var(--sat)) max(18px,var(--sar)) 86px max(18px,var(--sal));overflow:hidden;border-radius:0 0 30px 30px}
.hero .sky{position:absolute;inset:auto 0 0 0;height:120px;pointer-events:none;opacity:.95}
.hero-top{display:flex;align-items:center;gap:10px;position:relative}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand svg{width:34px;height:34px}
.lang-pill{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:rgba(255,255,255,.14);font-size:13px;font-weight:700;color:#fff}
.lang-pill svg{width:16px;height:16px}
.hero h2{position:relative;margin:22px 0 2px;font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.hero p{position:relative;margin:0 0 16px;opacity:.82;font-size:14.5px}
.search{position:relative;display:flex;align-items:center;gap:10px;height:52px;border-radius:16px;background:#fff;color:var(--ink);padding:0 14px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.search svg{width:20px;height:20px;color:var(--ink-3);flex:none}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;font-size:15px}
.prayer{position:relative;margin:-62px max(16px,var(--sar)) 0 max(16px,var(--sal));background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 16px;z-index:2}
.prayer-head{display:flex;align-items:center;gap:12px}
.prayer-ico{width:44px;height:44px;border-radius:14px;background:var(--date-tint);color:var(--date-2);display:flex;align-items:center;justify-content:center;flex:none}
.prayer-ico svg{width:24px;height:24px}
.prayer small{display:block;font-size:12px;color:var(--ink-2);font-weight:600}
.prayer b{font-size:18px;font-weight:800}
.prayer .cd{margin-inline-start:auto;text-align:end}
.prayer .cd b{color:var(--palm)}
.prayer-row{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);gap:4px}
.prayer-row div{flex:1;text-align:center;font-size:11.5px;color:var(--ink-2);border-radius:10px;padding:4px 0}
.prayer-row div b{display:block;font-size:13.5px;color:var(--ink);font-weight:700}
.prayer-row div.on{background:var(--palm-tint)}
.prayer-row div.on b{color:var(--palm)}
.prayer-note{font-size:11px;color:var(--ink-3);margin-top:8px;text-align:center}

/* section headings */
.sec{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sec h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;flex:1}
.sec button{font-size:13.5px;font-weight:700;color:var(--palm)}

/* big category cards */
.bigcats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.bigcat{position:relative;height:150px;border-radius:var(--r-lg);overflow:hidden;color:#fff;text-align:start;box-shadow:var(--shadow);background:#2a3}
.bigcat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bigcat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,40,33,0) 30%,rgba(10,40,33,.82))}
.bigcat span{position:absolute;inset:auto 14px 12px 14px;z-index:1}
.bigcat b{display:block;font-size:18px;font-weight:800}
.bigcat small{font-size:12px;opacity:.85}
.bigcat:active{transform:scale(.98)}

/* small category tiles */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;font-size:11.5px;font-weight:700;line-height:1.2;color:var(--ink)}
.cat i{width:100%;aspect-ratio:1;max-width:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--shadow)}
.cat i svg{width:30px;height:30px}
.cat:active i{transform:scale(.95)}
.c-palm{color:var(--palm)} .c-date{color:var(--date-2)} .c-rose{color:var(--rose)} .c-sky{color:var(--sky)} .c-clay{color:var(--clay)}
.b-palm{background:var(--palm-tint)!important} .b-date{background:var(--date-tint)!important} .b-rose{background:var(--rose-tint)!important} .b-sky{background:var(--sky-tint)!important} .b-clay{background:var(--clay-tint)!important}

/* listing cards */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px max(16px,var(--sar)) 6px max(16px,var(--sal));margin:0 calc(-1 * max(16px,var(--sar))) 0 calc(-1 * max(16px,var(--sal)));scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.lcard{position:relative;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;text-align:start;width:100%}
.hscroll .lcard{flex:0 0 78%;scroll-snap-align:start}
.lcard .ph{position:relative;aspect-ratio:4/3;background:var(--palm-tint);overflow:hidden}
.lcard .ph img{width:100%;height:100%;object-fit:cover}
.lcard .body{padding:12px 14px 14px}
.lcard .ttl{font-weight:700;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lcard .meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.lcard .meta span{display:inline-flex;align-items:center;gap:4px}
.lcard .meta svg{width:15px;height:15px}
.lcard .price{margin-top:8px;font-size:18px;font-weight:800;color:var(--palm)}
.lcard .price small{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip-on-photo{position:absolute;top:10px;inset-inline-start:10px;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:13px;background:rgba(255,255,255,.94);font-size:11.5px;font-weight:700;color:var(--palm)}
.chip-on-photo svg{width:14px;height:14px}
.heart{position:absolute;top:8px;inset-inline-end:8px;width:38px;height:38px;border-radius:19px;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;color:var(--ink-2);z-index:2}
.heart svg{width:20px;height:20px}
.heart.on{color:#d1435b}
.heart.on svg path{fill:#d1435b}
.rating{position:absolute;bottom:10px;inset-inline-start:10px;display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 8px;border-radius:12px;background:rgba(19,37,31,.72);color:#fff;font-size:12px;font-weight:700}
.rating svg{width:13px;height:13px;color:var(--date)}
.list{display:grid;gap:14px}
.row-card{display:flex;gap:12px;background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);padding:10px;text-align:start;width:100%;align-items:center}
.row-card .thumb{width:84px;height:84px;border-radius:12px;overflow:hidden;flex:none;background:var(--palm-tint)}
.row-card .thumb img{width:100%;height:100%;object-fit:cover}
.row-card .grow{flex:1;min-width:0}
.row-card .ttl{font-weight:700;line-height:1.3}
.row-card .sub{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.row-card .price{font-weight:800;color:var(--palm);margin-top:5px}

/* segmented + chips */
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.seg button{flex:1;height:38px;border-radius:11px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--palm);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px max(16px,var(--sar)) 4px max(16px,var(--sal));margin:0 calc(-1 * max(16px,var(--sar))) 0 calc(-1 * max(16px,var(--sal)));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip svg{width:16px;height:16px}
.count{font-size:13px;color:var(--ink-2);margin:14px 0 10px;font-weight:600}

/* detail */
.gallery{position:relative;background:#0b2a23}
.gallery .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gallery .track::-webkit-scrollbar{display:none}
.gallery img{flex:0 0 100%;width:100%;aspect-ratio:4/3.2;object-fit:cover;scroll-snap-align:center}
.gallery .dots{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.gallery .dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.55);transition:width .2s}
.gallery .dots i.on{width:20px;background:#fff}
.gallery .float{position:absolute;top:calc(10px + var(--sat));left:max(14px,var(--sal));right:max(14px,var(--sar));display:flex;justify-content:space-between;z-index:3}
.gallery .float .ibtn{background:rgba(255,255,255,.94)}
.sheetbody{position:relative;margin-top:-16px;background:var(--sand);border-radius:22px 22px 0 0;padding-top:18px}
.d-title{margin:0;font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
.d-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:8px;font-size:13.5px;color:var(--ink-2)}
.d-sub span{display:inline-flex;align-items:center;gap:5px}
.d-sub svg{width:16px;height:16px}
.verified{display:flex;align-items:center;gap:10px;margin-top:14px;padding:11px 14px;border-radius:var(--r-md);background:var(--palm-tint);color:var(--palm-2);font-size:13px;font-weight:700}
.verified svg{width:22px;height:22px;flex:none}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.fact{background:var(--card);border-radius:var(--r-sm);padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.fact svg{width:22px;height:22px;color:var(--palm);margin:0 auto 4px}
.fact b{display:block;font-size:15px;font-weight:800}
.fact small{font-size:11px;color:var(--ink-2)}
.block{margin-top:22px}
.block h4{margin:0 0 10px;font-size:16px;font-weight:800}
.block p{margin:0;color:var(--ink);line-height:1.6}
.amen{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amen span{display:flex;align-items:center;gap:9px;font-size:14px}
.amen svg{width:20px;height:20px;color:var(--palm);flex:none}
.kv{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;font-size:14px}
.kv div+div{border-top:1px solid var(--line)}
.kv span{color:var(--ink-2)}
.kv b{font-weight:700;text-align:end}
.map{position:relative;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow);background:#EAE4D6}
.map svg{display:block;width:100%;height:auto}
.map .cap{position:absolute;bottom:10px;inset-inline-start:10px;inset-inline-end:10px;background:rgba(255,255,255,.95);border-radius:12px;padding:8px 12px;font-size:12.5px;color:var(--ink-2)}
.map .cap b{color:var(--ink)}
.review{background:var(--card);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow)}
.review+.review{margin-top:10px}
.review .who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.review .who i{width:30px;height:30px;border-radius:15px;background:var(--date-tint);color:var(--date-2);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800}
.review .stars{color:var(--date);display:inline-flex}
.review .stars svg{width:14px;height:14px}
.review p{margin:6px 0 0;font-size:14px;color:var(--ink)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--sand);color:var(--ink-3);border:1px solid var(--line)}
.tag.gold{background:var(--date-tint);color:#8a5a0c;border-color:transparent}
.tag.green{background:var(--palm-tint);color:var(--palm);border-color:transparent}
.tag.rose{background:var(--rose-tint);color:var(--rose);border-color:transparent}
.cta-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:flex;align-items:center;gap:12px;padding:12px max(16px,var(--sar)) calc(12px + var(--sab)) max(16px,var(--sal));background:rgba(255,255,255,.97);border-top:1px solid var(--line);backdrop-filter:blur(12px)}
.cta-bar .p{flex:none}
.cta-bar .p b{font-size:19px;font-weight:800;color:var(--palm);display:block;line-height:1.1}
.cta-bar .p small{font-size:12px;color:var(--ink-2)}
.btn{height:52px;border-radius:16px;padding:0 20px;font-weight:800;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--date);color:#2f1d00;box-shadow:0 6px 16px rgba(227,162,59,.35)}
.btn.primary:active{background:var(--date-2)}
.btn.green{background:var(--palm);color:#fff}
.btn.soft{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.line{border:1.5px solid var(--line);background:transparent}
.btn.full{width:100%}
.btn.sm{height:38px;font-size:13.5px;border-radius:12px;padding:0 14px}
.btn:disabled{opacity:.45}
.btn:not(:disabled):active{transform:scale(.98)}
.cta-bar .btn{flex:1}

/* info cards */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini .card{padding:14px}
.mini h5{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.mini h5 svg{width:16px;height:16px}
.rate-big{font-size:20px;font-weight:800}
.rate-small{font-size:11px;color:var(--ink-3);margin-top:6px;line-height:1.35}
.em{display:grid;gap:8px}
.em a{display:flex;align-items:center;justify-content:space-between;font-size:13px}
.em a b{font-size:15px;color:var(--rose)}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-md);background:var(--date-tint);color:#5a3c06;font-size:13.5px;line-height:1.5}
.banner svg{width:22px;height:22px;flex:none;color:var(--date-2)}
.banner b{display:block;margin-bottom:2px;color:#3f2a04}
.banner.green{background:var(--palm-tint);color:var(--palm-2)}
.banner.green svg{color:var(--palm)}
.banner.rose{background:var(--rose-tint);color:#6d2740}
.banner.rose svg{color:var(--rose)}

/* posts (majlis) */
.post{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);padding:14px}
.post+.post{margin-top:12px}
.post .who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.post .who .tag{margin-inline-start:auto}
.post p{margin:8px 0 0;font-size:14.5px;line-height:1.55}
.post .acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;white-space:nowrap;margin-top:10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.post .acts button{display:inline-flex;align-items:center;gap:5px}
.post .acts svg{width:17px;height:17px}
.post .acts .on{color:var(--palm)}
.post .acts .rep{margin-inline-start:auto;color:var(--ink-3);font-weight:600}
.answer{margin-top:12px;padding:12px;border-radius:12px;background:var(--palm-soft);border-inline-start:3px solid var(--palm)}
.answer p{margin-top:6px;font-size:14px}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.topic{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);padding:12px;text-align:start;font-weight:700;font-size:14px;line-height:1.25}
.topic i{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.topic i svg{width:20px;height:20px}
.topic small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:2px}

/* rooms & events */
.room{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);padding:12px;text-align:start;width:100%}
.room+.room{margin-top:10px}
.room i{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:none}
.room i svg{width:24px;height:24px}
.room .grow{flex:1;min-width:0}
.room b{display:block;font-size:15px}
.room small{display:block;color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room em{font-style:normal;font-size:12px;color:var(--ink-3);font-weight:700}
.event{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);padding:14px;display:grid;gap:10px}
.event+.event{margin-top:12px}
.event .top{display:flex;gap:12px;align-items:center}
.event .date{width:52px;height:52px;border-radius:14px;background:var(--date-tint);color:var(--date-2);display:flex;align-items:center;justify-content:center;flex:none}
.event .date svg{width:26px;height:26px}
.event b{font-size:15.5px}
.event small{display:block;font-size:12.5px;color:var(--ink-2)}
.progress{height:8px;border-radius:4px;background:var(--palm-tint);overflow:hidden}
.progress i{display:block;height:100%;background:var(--palm);border-radius:4px;transition:width .3s}
.event .foot{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);font-weight:600}
.event .foot .btn{margin-inline-start:auto}

/* chat */
.chat-list .row-card .thumb{width:56px;height:56px;border-radius:16px}
.chat-wrap{display:flex;flex-direction:column;gap:8px;padding-top:12px}
.bubble{max-width:82%;padding:10px 13px;border-radius:18px;font-size:14.5px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.bubble.me{align-self:flex-end;background:var(--palm);color:#fff;border-end-end-radius:6px}
.bubble.op{align-self:flex-start;background:var(--card);border-end-start-radius:6px}
.bubble small{display:block;margin-top:4px;font-size:11px;opacity:.7}
.bubble .tr{text-align:start;display:flex;gap:8px;align-items:center;margin-top:6px;font-size:11.5px;color:var(--palm);font-weight:700}
.bubble .tr svg{width:14px;height:14px}
.bubble.typing{display:flex;gap:4px}
.bubble.typing i{width:7px;height:7px;border-radius:4px;background:var(--ink-3);animation:blink 1s infinite}
.bubble.typing i:nth-child(2){animation-delay:.15s}.bubble.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.listing-pin{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:8px;box-shadow:var(--shadow)}
.listing-pin img{width:48px;height:48px;border-radius:10px;object-fit:cover}
.listing-pin b{font-size:13.5px;display:block;line-height:1.25}
.listing-pin small{font-size:12px;color:var(--palm);font-weight:700}
.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;padding:10px max(12px,var(--sar)) calc(10px + var(--sab)) max(12px,var(--sal));background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1.5px solid var(--line);border-radius:20px;padding:11px 14px;max-height:120px;min-height:44px;outline:0;background:var(--sand);font-size:15px}
.composer textarea:focus{border-color:var(--palm)}
.composer .send{width:44px;height:44px;border-radius:22px;background:var(--palm);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.composer .send svg{width:20px;height:20px}
.composer .share{width:44px;height:44px;border-radius:22px;background:var(--sand);color:var(--palm);display:flex;align-items:center;justify-content:center;flex:none}
.composer .share svg{width:20px;height:20px}
.desk .composer{position:absolute}

/* sheet & toast */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,30,25,.36);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:88%;overflow-y:auto;background:var(--sand);border-radius:26px 26px 0 0;padding:10px max(18px,var(--sar)) calc(18px + var(--sab)) max(18px,var(--sal));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:#d8d0c2;margin:0 auto 12px}
.sheet h3{margin:0 0 6px;font-size:20px;font-weight:800}
.field{display:grid;gap:6px;margin-top:14px}
.field label{font-size:13px;font-weight:700;color:var(--ink-2)}
.field input,.field textarea,.field select{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);outline:0;font-size:15px;width:100%}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--palm)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;line-height:1.45}
.check input{width:22px;height:22px;accent-color:var(--palm);flex:none;margin:0}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);margin-top:10px;box-shadow:var(--shadow)}
.opt input{width:22px;height:22px;accent-color:var(--date-2);flex:none;margin:0}
.opt b{display:block;font-size:14.5px}
.opt small{color:var(--ink-2);font-size:12.5px}
.opt .pr{margin-inline-start:auto;font-weight:800;color:var(--palm);white-space:nowrap}
.toast-box{position:fixed;left:0;right:0;top:calc(12px + var(--sat));z-index:80;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:tdown .25s;max-width:440px;text-align:center}
@keyframes tdown{from{opacity:0;transform:translateY(-10px)}}

/* gates: desktop, in-app, install, language */
.gate{min-height:100dvh;width:100%;display:flex;flex-direction:column;background:linear-gradient(175deg,#12705D,var(--palm) 45%,var(--palm-2));color:#fff;padding:calc(20px + var(--sat)) max(22px,var(--sar)) calc(22px + var(--sab)) max(22px,var(--sal));position:relative;overflow:hidden}
.gate .brand{font-size:24px}
.gate .brand svg{width:44px;height:44px}
.gate h1{margin:22px 0 8px;font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.gate p{margin:0;opacity:.86;font-size:15px;line-height:1.55;max-width:34ch}
.gate .illus{display:flex;justify-content:center;margin:22px 0 6px}
.gate .illus svg{width:min(250px,64vw);height:auto}
.gate .steps{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px}
.gate .steps li{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.4}
.gate .steps .n{width:30px;height:30px;border-radius:15px;background:var(--date);color:#2f1d00;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.gate .steps svg{width:20px;height:20px;vertical-align:-4px}
.gate .push{margin-top:auto;padding-top:22px;display:grid;gap:10px}
.gate .btn.ghostw{background:rgba(255,255,255,.12);color:#fff}
.gate .small{font-size:12.5px;opacity:.75;text-align:center;line-height:1.5}
.gate .langsel{position:absolute;top:calc(20px + var(--sat));inset-inline-end:max(22px,var(--sar))}
.qr{background:#fff;border-radius:20px;padding:14px;display:inline-block;margin:22px 0 10px}
.qr canvas,.qr img{width:200px!important;height:200px!important}
.gate.center{align-items:center;justify-content:center;text-align:center}
.gate.center p{margin:0 auto}
.gate.light{background:var(--sand);color:var(--ink)}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.lang{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);text-align:start;border:2px solid transparent}
.lang b{font-size:17px;font-weight:800}
.lang small{font-size:12px;color:var(--ink-3);font-weight:600}
.lang.on{border-color:var(--palm);background:var(--palm-soft)}
.lang:active{transform:scale(.98)}

/* profile */
.plist{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.plist button,.plist a{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:start;font-weight:600}
.plist button+button,.plist button+a,.plist a+button{border-top:1px solid var(--line)}
.plist i{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.plist i svg{width:20px;height:20px}
.plist .grow{flex:1;min-width:0}
.plist small{display:block;font-size:12.5px;color:var(--ink-2);font-weight:500}
.plist .chev{width:18px;height:18px;color:var(--ink-3)}
.plist .optrow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;font-weight:600;border-top:1px solid var(--line);cursor:pointer}
.plist .optrow input{width:22px;height:22px;accent-color:var(--palm);flex:none}
.avatar{width:64px;height:64px;border-radius:22px;background:var(--date-tint);color:var(--date-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px}
.empty{text-align:center;padding:40px 20px;color:var(--ink-2)}
.empty svg{width:140px;height:auto;margin:0 auto 14px}
.empty .btn svg{width:20px;height:20px;margin:0}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.status{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:800}
.st-new{background:var(--date-tint);color:#8a5a0c}.st-work{background:var(--sky-tint);color:var(--sky)}.st-view{background:var(--palm-tint);color:var(--palm)}.st-done{background:#e9e9e9;color:#555}
.demo-flag svg{width:14px;height:14px}
.demo-flag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-3);margin:14px auto 0}

/* ---------- community: comments, author, rooms ---------- */
.av{width:34px;height:34px;border-radius:12px;background:var(--date-tint);color:var(--date-2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.av.sm{width:26px;height:26px;border-radius:9px;font-size:12px}
.av.lg{width:48px;height:48px;border-radius:16px;font-size:18px;background:var(--palm-tint);color:var(--palm)}
.av.me{background:var(--palm);color:#fff}
.thread{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.cmts{display:grid;gap:12px}
.cmt{display:flex;gap:10px;align-items:flex-start}
.cmt.sub{margin-inline-start:22px}
.cmt .cb{flex:1;min-width:0;background:var(--palm-soft);border-radius:4px 14px 14px 14px;padding:9px 12px}
[dir=rtl] .cmt .cb{border-radius:14px 4px 14px 14px}
.cmt .cw{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.cmt .cw small{color:var(--ink-3);font-size:11.5px;margin-inline-start:auto}
.cmt .to{display:inline-flex;align-items:center;gap:2px;color:var(--palm);font-weight:700;font-size:12px}
.cmt p{margin:4px 0 0;font-size:14px;line-height:1.5}
.cmt .ca{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--palm)}
.cmt .ca button,.cmt .ca span{display:inline-flex;align-items:center;gap:4px}
.cmt .ca span{color:var(--ink-3);font-weight:600}
.cbox{margin-top:12px}
.crow{display:flex;gap:8px;align-items:flex-end}
.crow textarea{flex:1;min-width:0;resize:none;border:1.5px solid var(--line);border-radius:18px;padding:10px 14px;min-height:42px;max-height:120px;outline:0;background:var(--card);font-size:14.5px}
.crow textarea:focus{border-color:var(--palm)}
.crow .send{width:42px;height:42px;border-radius:21px;background:var(--palm);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.crow .send svg{width:19px;height:19px}
.rchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:15px;background:var(--palm-tint);color:var(--palm-2);font-size:12.5px;margin-bottom:8px}
.rchip button{width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center}
.composer{flex-wrap:wrap}
.composer .rchip{flex-basis:100%;max-width:max-content;margin:0 0 2px}
.seller{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);padding:12px 14px}
.seller .grow{flex:1;min-width:0}
.seller b{display:block;font-size:15px}
.seller small{display:block;font-size:12.5px;color:var(--ink-2)}
.item-head{position:relative;height:180px;background:linear-gradient(160deg,var(--palm-tint),var(--date-tint));display:flex;align-items:center;justify-content:center}
.item-head .float{position:absolute;top:calc(10px + var(--sat));left:max(14px,var(--sal));right:max(14px,var(--sar));display:flex}
.item-head .big-ic{width:88px;height:88px;border-radius:28px;background:#fff;color:var(--palm);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.item-head .big-ic svg{width:44px;height:44px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg .bubble{max-width:100%}
.bubble.op>button:first-child{display:block}
.bubble .nm{display:block;font-size:12.5px;color:var(--palm);margin-bottom:2px}
.bubble .rto{display:flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;opacity:.8;margin-bottom:3px}
.bubble .ma{display:flex;gap:12px;margin-top:6px;font-size:12px;font-weight:700;color:var(--palm)}
.two-btn{display:grid;gap:10px}
.rooms-grid{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.rooms-grid .room+.room{margin-top:0}
.lang-pill.dark{background:var(--palm-tint);color:var(--palm)}

/* ---------- desktop ---------- */
.dnav{display:none}
.dsk .dnav{display:block;position:sticky;top:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.dsk .dnav-in{max-width:1240px;margin:0 auto;padding:12px 32px;display:flex;align-items:center;gap:24px}
.dsk .dnav .brand{font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px}
.dsk .dnav .brand svg{width:36px;height:36px}
.dsk .dnav nav{display:flex;gap:4px;margin-inline-start:24px}
.dsk .dnav nav button{position:relative;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:12px;font-weight:700;font-size:14.5px;color:var(--ink-2)}

.mg .mgctop{background:rgba(249,249,249,.9);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid rgba(60,60,67,.12)}
.mgthread.m8th .m8who{display:none}
.mgthread.m8th .m8bav{flex:none;align-self:flex-end}
.mgthread.m8th.bubbles .mgb{background:#E9E9EB;color:var(--mg-ink);border:0;box-shadow:none;border-radius:18px 18px 18px 6px}
.mgthread.m8th.bubbles .mgb.me{background:var(--mg-acc);color:#fff;border-radius:18px 18px 6px 18px}
.mgthread.m8th.bubbles .mgb.me small,.mgthread.m8th.bubbles .mgb.me .mgtick{color:rgba(255,255,255,.75)}
/* cards: each message is a rounded card with the sender's photo and name */
.mgthread.m8th.cards .mgbrow{position:relative;display:flex;align-items:center;gap:0;max-width:88%;margin:6px 0;padding:8px 14px 8px 8px;border-radius:30px;background:#F2F2F7}
.mgthread.m8th.cards .mgbrow.me{margin-inline-start:auto;background:#1C1C1E;color:#fff}
.mgthread.m8th.cards .m8bav{align-self:flex-start;margin-inline-end:10px}
.mgthread.m8th.cards .m8bav .mgav.bb,.mgthread.m8th.cards .mgbrow>.mgav.bb{width:44px;height:44px;display:block;visibility:visible}
.mgthread.m8th.cards .mgb{flex:1;min-width:0;background:transparent!important;border:0;box-shadow:none;padding:2px 0;max-width:none;border-radius:0;color:inherit}
.mgthread.m8th.cards .m8who{display:block;font-size:14px;font-weight:600;margin-bottom:1px}
.mgthread.m8th.cards .mgbrow.me .m8who{color:#fff}
.mgthread.m8th.cards .mgtx{font-size:15px;line-height:1.38}
.mgthread.m8th.cards .mgb small{text-align:end;color:#8E8E93}
.mgthread.m8th.cards .mgbrow.me .mgb small,.mgthread.m8th.cards .mgbrow.me .mgtick{color:rgba(255,255,255,.6)}
.mgthread.m8th.cards .mgbrow.me .mgtick.rd{color:#64D2FF}
.mgthread.m8th.cards .mgb.media{padding:2px 0}
.mgthread.m8th.cards .mgb img,.mgthread.m8th.cards .mgb video{border-radius:18px;max-width:100%}
.mgthread.m8th.cards .mgbrow.me .mgtrp{color:rgba(255,255,255,.7)}
.mgthread.m8th.cards .mgbrow.me .mgvp{background:#fff;color:#1C1C1E}.mgthread.m8th.cards .mgbrow.me .mgvw{background:rgba(255,255,255,.25)}.mgthread.m8th.cards .mgbrow.me .mgvw i{background:#fff}.mgthread.m8th.cards .mgbrow.me .mgvoice em{color:rgba(255,255,255,.7)}
.mgthread.m8th.cards .mgbrow.me .mgq{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);border-color:#64D2FF}.mgthread.m8th.cards .mgbrow.me .mgq b{color:#64D2FF}
.mg .mgcomp{background:rgba(249,249,249,.94);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid rgba(60,60,67,.18)}
.mg .mgcomp textarea{border-radius:20px;background:#fff;border:.5px solid #C7C7CC}
.mg .mgsend{background:var(--mg-acc);color:#fff}
/* ===== Magaam 9: stories + photo-only profile ===== */
.m8stories{display:flex;gap:14px;overflow-x:auto;padding:2px 4px 14px;margin:0 -16px 2px;padding-inline:16px;scrollbar-width:none}.m8stories::-webkit-scrollbar{display:none}
.m8st{flex:none;width:68px;border:0;background:none;padding:0;font:inherit;color:var(--mg-ink);display:flex;flex-direction:column;align-items:center;gap:5px}
.m8st small{font-size:12px;max-width:68px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mg-ink)}
.m8stav{position:relative;display:block}.m8stav>i{position:absolute;inset-inline-end:-1px;bottom:-1px;width:22px;height:22px;border-radius:50%;background:#0A84FF;color:#fff;border:2.5px solid var(--mg-bg);display:flex;align-items:center;justify-content:center}.m8stav>i svg{width:12px;height:12px;stroke-width:3}
.m8ring{display:inline-block;border-radius:50%;padding:2.5px;background:transparent;line-height:0}
.m8ring.new{background:conic-gradient(from 210deg,#0A84FF,#5E5CE6,#BF5AF2,#FF9F0A,#0A84FF)}
.m8ring.seen{background:#D1D1D6}
.m8ring>.mgav{display:block;border:2.5px solid var(--mg-bg);border-radius:50%}
.m8list .m8ring>.mgav,.m8row .m8ring>.mgav{border-color:#fff}
.m8ring>.mgav.st{width:62px;height:62px}
.m8row .m8ring{flex:none}.m8row .m8ring>.mgav.md{width:46px;height:46px}
.m8row .m8ring:not(.new):not(.seen){padding:0}.m8row .m8ring:not(.new):not(.seen)>.mgav{border:0}
/* profile: only the photo */
.m8prof2{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 24px 40px}
.m8bigav{border:0;background:none;padding:0;line-height:0}.m8bigav .m8ring{padding:4px}.m8bigav .mgav.xl{width:148px;height:148px;border-width:4px}
.m8bigav .m8ring:not(.new):not(.seen){padding:0}.m8bigav .m8ring:not(.new):not(.seen)>.mgav{border:0;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.m8chph{margin-top:10px;font-size:14px}
.m8prof2 h2{margin:16px 0 0;font-size:28px;font-weight:700;letter-spacing:-.02em}
.m8prof2 .m8bio{max-width:30ch;font-size:16px;color:#3A3A3C}
.m8prof2 .m8acts{width:100%;max-width:380px;margin-top:22px}.m8acts .m8btn{white-space:nowrap;font-size:14.5px;padding:0 14px}.m8acts .m8btn:not(.sq){flex:1 1 auto;max-width:none}
/* story viewer */
.m8sv{position:fixed;inset:0;z-index:90;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;animation:fade .2s}
.m8sv-media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.m8sv-media img,.m8sv-media video{width:100%;height:100%;object-fit:contain}
.m8sv-top{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 30px;background:linear-gradient(rgba(0,0,0,.45),transparent);z-index:3}
.m8sv-bars{display:flex;gap:4px}.m8sv-bars i{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}.m8sv-bars i.done b{width:100%}.m8sv-bars b{display:block;height:100%;width:0;background:#fff}
.m8sv-bars b.run{animation:m8bar linear forwards}@keyframes m8bar{to{width:100%}}
.m8sv-who{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.m8sv-who button{border:0;background:none;color:#fff;font:inherit;display:flex;align-items:center;gap:8px;padding:0}.m8sv-who b{font-size:15px}.m8sv-who small{font-size:13px;opacity:.7}.m8sv-who svg{width:26px;height:26px}
.m8sv-who .mgav.sm{width:34px;height:34px}
.m8sv-nav{position:absolute;top:90px;bottom:90px;width:35%;border:0;background:transparent;z-index:2}.m8sv-nav.l{left:0}.m8sv-nav.r{right:0;width:65%}
.m8sv-cap{position:absolute;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));margin:0;text-align:center;font-size:17px;line-height:1.4;text-shadow:0 1px 6px rgba(0,0,0,.6);z-index:3}
.m8sv-reply{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:4}
.m8sv-reply input{flex:1;min-width:0;height:46px;border-radius:23px;border:1px solid rgba(255,255,255,.45);background:rgba(0,0,0,.25);color:#fff;padding:0 18px;font:inherit;font-size:16px;outline:0;backdrop-filter:blur(10px)}.m8sv-reply input::placeholder{color:rgba(255,255,255,.7)}
.m8sv-reply button{width:46px;height:46px;border-radius:50%;border:0;background:#fff;color:#000;display:flex;align-items:center;justify-content:center}.m8sv-reply svg{width:20px;height:20px}
.m8stprev{border-radius:18px;overflow:hidden;background:#000;margin:6px 0 4px}.m8stprev img,.m8stprev video{display:block;width:100%;max-height:52vh;object-fit:contain}
