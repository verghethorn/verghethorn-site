name: build-work-samples
on:
  push:
    branches: [assets-work]
    paths: ['tools/work.json']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: AnimMouse/setup-ffmpeg@v1
      - run: |
          mkdir -p wout
          url=$(python3 -c "import json;print(json.load(open('tools/work.json'))['product'])")
          curl -sSL -o wout/raw_product.mp4 "$url"
          ffmpeg -y -v error -i wout/raw_product.mp4 -an -vf "scale=1280:-2:flags=lanczos" -c:v libx264 -preset slow -crf 22 -pix_fmt yuv420p -movflags +faststart wout/product.mp4
          ffmpeg -y -v error -ss 0.6 -i wout/raw_product.mp4 -vf "scale=1280:-2" -frames:v 1 -q:v 3 wout/product.jpg
          ffmpeg -y -v error -i vout/hero1.mp4 -an -vf "crop=ih*9/16:ih,scale=540:960:flags=lanczos" -c:v libx264 -preset slow -crf 23 -pix_fmt yuv420p -movflags +faststart wout/ad.mp4
          ffmpeg -y -v error -ss 0.3 -i wout/ad.mp4 -frames:v 1 -q:v 3 wout/ad.jpg
          for t in 0.5 1.5 2.5 3.5 4.5; do ffmpeg -y -v error -ss $t -i wout/raw_product.mp4 -vf "scale=480:-2" -frames:v 1 wout/pf_$t.jpg; ffmpeg -y -v error -ss $t -i wout/ad.mp4 -vf "scale=-2:360" -frames:v 1 wout/af_$t.jpg; done
          rm wout/raw_product.mp4; ls -la wout
      - run: |
          git config user.name "Rashid Kurabegov"; git config user.email "verghethorn@gmail.com"
          git add -A wout && git commit -m "Built work samples" && git pull --rebase -X ours && git push
