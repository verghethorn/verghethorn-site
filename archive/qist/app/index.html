<style>
:root{--bg:#F5F5F7;--card:#fff;--text:#1D1D1F;--muted:#6E6E73;--line:#EDEDF0;--acc:#0B7A5C;--acc2:#08694F;--light:#34C391;--soft:#E3F2EC;--red:#B3261E;--redbg:#FDECEA;--amber:#8A4B00;--amberbg:#FFF1D6;--top:max(14px, env(safe-area-inset-top));--bottom:env(safe-area-inset-bottom)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);max-width:560px;margin:0 auto}
#view{flex:1;display:flex;flex-direction:column;min-height:0}
@media (min-width:640px) and (min-height:780px){
  body{display:flex;align-items:center;justify-content:center;background:#E6E6EA}
  #app{width:390px;height:844px;flex:none;border-radius:50px;box-shadow:0 0 0 11px #0B0B0C,0 40px 90px rgba(0,0,0,.25);--top:46px;--bottom:18px}
}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-height:0}
.scroll::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;margin:0;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(var(--top) + 4px) 16px 2px;min-height:56px}
.back{display:flex;align-items:center;gap:1px;color:var(--acc);font-size:17px;min-height:44px;margin-left:-6px;padding-right:8px}
.brand{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:800;letter-spacing:-.03em}
.menu{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;background:#fff;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px #E5E5EA;white-space:nowrap}
.wrap{padding:0 20px 32px}
.t{margin:10px 0 0;font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.12}
.sub{margin:4px 0 0;color:var(--muted);font-size:15px;line-height:1.4}
.card{background:var(--card);border-radius:22px}
.pad{padding:20px}
.h2{margin:28px 0 10px 4px;font-size:20px;font-weight:700;letter-spacing:-.02em}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left;min-height:64px}
.card>.row+.row,.card>.kv+.kv{border-top:1px solid var(--line)}
.av{width:42px;height:42px;border-radius:21px;background:#F0F0F3;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0}
.tile{border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.grow{flex:1;min-width:0}
.name{font-size:17px;font-weight:600}
.meta{font-size:14px;color:var(--muted);margin-top:2px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.barbg{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.barfg{height:100%;border-radius:4px;background:var(--acc)}
.btn{width:100%;min-height:56px;border-radius:16px;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.btn.pri{background:var(--acc);color:#fff}
.btn.dark{background:#1D1D1F;color:#fff}
.btn.sec{background:#fff;color:var(--acc)}
.btn.gray{background:#EFEFF2;color:var(--text)}
.btn.big{min-height:60px;font-size:19px;border-radius:18px}

.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);min-height:50px;padding-top:4px;text-align:center}
.tab.on{color:var(--acc)}
.toast{position:absolute;left:16px;right:16px;top:calc(var(--top) + 6px);z-index:20;background:#1D1D1F;color:#fff;border-radius:16px;padding:14px 16px;font-size:15px;font-weight:500;line-height:1.35;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.22);transform:translateY(-10px);opacity:0;transition:opacity .2s ease,transform .2s ease;pointer-events:none}
.toast.show{opacity:1;transform:none}
.fg{background:#fff;border-radius:18px;overflow:hidden}
.field{display:block;padding:12px 16px}
.fg .field+.field{border-top:1px solid var(--line)}
.field label{display:block;font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{width:100%;border:none;outline:none;font:inherit;font-size:17px;padding:5px 0 1px;background:transparent;color:var(--text);-webkit-appearance:none;appearance:none;border-radius:0}
.field input::placeholder{color:#A1A1A6}
.lbl{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:24px 0 8px 4px}

.seg button{flex:1;height:40px;border-radius:9px;font-size:15px;font-weight:600;color:var(--muted);text-align:center}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{height:44px;min-width:56px;padding:0 16px;border-radius:22px;background:#fff;font-size:15px;font-weight:600;box-shadow:inset 0 0 0 1px #E5E5EA;text-align:center}
.chips button.on{background:var(--acc);color:#fff;box-shadow:none}
.err{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--redbg);color:var(--red);font-size:15px;font-weight:500}
.cal{overflow-x:auto;background:#fff;border-radius:20px;scrollbar-width:none}
.cal::-webkit-scrollbar{display:none}
.cal table{border-collapse:separate;border-spacing:0}
.cal th,.cal td{padding:0;font-weight:inherit}
.cal .nm{position:sticky;left:0;z-index:1;background:#fff;text-align:left;min-width:104px;max-width:104px;padding:6px 6px 6px 14px;box-shadow:6px 0 8px -8px rgba(0,0,0,.25)}
.cal .nm button{display:block;width:100%;text-align:left;min-height:40px}
.cal tbody tr+tr td{border-top:1px solid var(--line)}
.mh{width:48px;margin:10px 2px 6px;padding:5px 0;border-radius:9px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);line-height:1.15}
.mh.cur{background:#1D1D1F;color:#fff}
.cc{width:48px;height:36px;margin:6px 2px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:14px 4px 0;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.full{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

function calc(f){
  var cost=parseFloat(String(f.cost).replace(/\s/g,'').replace(',','.'))||0;
  var sale=Math.round(cost*(1+f.markup/100));
  var mon=f.months?Math.round(sale/f.months):0;
  var p=String(f.date||'').split('-');var first=p.length===3?addM([+p[0],+p[1]-1,+p[2]],1):null;
  return {cost:cost,sale:sale,mon:mon,first:first};
}

function updateSummary(){
  var r=calc(S.form);
  var a=document.getElementById('s-mon'),b=document.getElementById('s-sale'),c=document.getElementById('s-mk'),d=document.getElementById('s-first');
  if(a)a.textContent=money(r.mon);if(b)b.textContent=money(r.sale);if(c)c.textContent=money(r.sale-r.cost);if(d)d.textContent=r.first?'Первый платёж '+dty(r.first):'';
}
function guessIcon(s){
  s=s.toLowerCase();
  if(/газел|грузов|камаз|фура|truck/.test(s))return 'truck';
  if(/авто|машин|toyota|тойот|renault|рено|kia|hyundai|bmw|mercedes|мерседес|lada|лада|camry|ford|chevrolet|honda|nissan|volkswagen/.test(s))return 'car';
  if(/iphone|телефон|смартфон|galaxy|xiaomi|айфон/.test(s))return 'phone';
  if(/ноутбук|macbook|компьютер|laptop|ipad|планшет/.test(s))return 'laptop';
  if(/холодил|стирал|плита|духов|кондиц|посудом/.test(s))return 'fridge';
  if(/мебел|диван|кровать|стол|шкаф|кухн/.test(s))return 'sofa';
  if(/кофе|кафе/.test(s))return 'cup';
  if(/запчаст|двигат|шины|колес/.test(s))return 'parts';
  if(/станок|инструмент|оборудован/.test(s))return 'tool';
  return 'box';
}

/* ---------- client side ---------- */
function clientNext(c){
  var xs=c.deals.map(info);
  var cand=xs.filter(function(x){return x.next&&!x.pend;}).sort(function(a,b){return (a.overdue.length?0:1)-(b.overdue.length?0:1)||a.next.date-b.next.date;});
  return {xs:xs,n:cand[0]||null};
}
SC['c-home'] = function(){
  var c=findClient(CLIENT_ID),o=clientNext(c),N=o.n;
  var first=c.name.split(' ')[0];
  var h=bar()+'<div class="wrap"><h1 class="t" style="font-size:30px;margin-top:14px">Ассаламу алейкум, '+esc(first)+'</h1>';
  if(N){
    var over=N.overdue.length>0;
    h+='<div style="margin-top:20px;padding:24px;border-radius:28px;background:'+(over?'#B3261E':'#08694F')+';color:#fff">'+
      '<div style="font-size:17px;color:#E3F5EE">'+(over?'Нужно оплатить':'Ближайший платёж')+'</div>'+
      '<div class="num" style="font-size:60px;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin-top:6px">'+money(over?N.overdueAmt:N.next.amt)+'</div>'+
      '<div style="font-size:21px;font-weight:600;margin-top:10px">до '+dt(N.next.date)+'</div>'+
      '<div style="font-size:17px;color:#E3F5EE;margin-top:2px">'+rel(N.dd)+' · '+esc(N.d.item)+'</div>'+
      '<button class="btn big" style="margin-top:22px;background:#fff;color:'+(over?'#B3261E':'#08694F')+';font-weight:700" data-act="pay" data-id="'+N.d.id+'">Как оплатить</button></div>';
  } else {
    h+='<div style="margin-top:20px;padding:28px 24px;border-radius:28px;background:#08694F;color:#fff;text-align:center"><div style="font-size:26px;font-weight:700">Всё оплачено</div><div style="font-size:17px;color:#E3F5EE;margin-top:6px">Баракаллаху фик! Платежей пока нет.</div></div>';
  }
  var pend=o.xs.filter(function(x){return x.pend;});
  pend.forEach(function(x){h+='<div style="margin-top:12px;padding:16px;border-radius:18px;background:#E8EEFC;display:flex;gap:12px;align-items:center">'+ic('clock','#1E40AF',22,2)+'<div style="font-size:16px;color:#1E3A8A;line-height:1.35"><b>'+money(x.pend.amt)+'</b> за «'+esc(x.d.item)+'» — на проверке у продавца</div></div>';});
  var left=sum(o.xs.map(function(x){return x.left;})),k=c.deals.length;
  h+='<div class="card pad" style="margin-top:12px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:15px;color:#6E6E73">Всего осталось</div><div class="num" style="font-size:26px;font-weight:700;margin-top:2px">'+money(left)+'</div></div><div style="font-size:15px;color:#6E6E73;text-align:right">по '+k+' '+pl(k,['покупке','покупкам','покупкам'])+'</div></div>';
  h+='<h2 class="h2" style="font-size:22px">Мои покупки</h2><div style="display:flex;flex-direction:column;gap:10px">'+o.xs.map(function(x){
    var nx=x.next?(x.pend?'Платёж на проверке':'Следующий: '+money(x.next.amt)+' · '+dt(x.next.date)):'Полностью оплачено';
    return '<button class="card" style="display:block;width:100%;padding:18px;text-align:left" data-act="deal" data-id="'+x.d.id+'"><div style="display:flex;align-items:center;gap:14px">'+tile(x.d,52)+'<div class="grow"><div style="font-size:19px;font-weight:700" class="ell">'+esc(x.d.item)+'</div><div style="font-size:15px;color:#6E6E73;margin-top:2px">'+nx+'</div></div>'+ic('chev','#A1A1A6',20,2)+'</div><div style="margin-top:16px">'+barHtml(x.pct,x.overdue.length?'#C4291C':'#0B7A5C',10)+'</div><div style="display:flex;justify-content:space-between;margin-top:10px;font-size:16px"><span style="color:#6E6E73">Оплачено '+x.d.paid+' из '+x.d.months+'</span><span>Осталось <b class="num">'+money(x.left)+'</b></span></div></button>';
  }).join('')+'</div>';
  h+='<button class="btn sec" style="margin-top:16px" data-act="ask">'+ic('chat','#0B7A5C',20,2)+'Написать продавцу</button></div>';
  return h;
};

SC['c-deal'] = function(){
  var d=findDeal(S.dealId),x=info(d);
  var sd=new Date(d.start[0],d.start[1],d.start[2]);
  var h=bar()+'<div class="wrap"><div style="display:flex;align-items:center;gap:14px;margin-top:6px">'+tile(d,60)+'<div class="grow"><h1 class="t" style="margin:0;font-size:26px">'+esc(d.item)+'</h1><div class="meta" style="font-size:15px">'+esc(d.desc||'')+'</div></div></div>';
  h+='<div class="card pad" style="margin-top:18px"><div style="font-size:16px;color:#6E6E73">Осталось оплатить</div><div class="num" style="font-size:44px;font-weight:700;letter-spacing:-.03em">'+money(x.left)+'</div><div style="font-size:16px;color:#6E6E73;margin-bottom:14px">Оплачено '+d.paid+' из '+d.months+' платежей</div>'+barHtml(x.pct,x.overdue.length?'#C4291C':'#0B7A5C',10)+'</div>';
  if(x.next){
    h+= x.pend
      ? '<button class="btn big gray" style="margin-top:14px" disabled>Платёж на проверке</button>'
      : '<button class="btn pri big" style="margin-top:14px" data-act="pay" data-id="'+d.id+'">Оплатить '+money(x.overdue.length?x.overdueAmt:x.next.amt)+'</button>';
  }
  h+='<h2 class="h2" style="font-size:22px">Условия</h2><div class="card">'+[['Цена',money(d.sale)],['Каждый месяц',money(x.mon)],['Срок',d.months+' мес.'],['Дата покупки',dty(sd)]].map(function(r){return '<div class="kv" style="font-size:17px"><span>'+r[0]+'</span><span class="num">'+r[1]+'</span></div>';}).join('')+'</div>';
  h+='<h2 class="h2" style="font-size:22px">График платежей</h2><div class="card">'+scheduleRows(x,true)+'</div></div>';
  return h;
};

SC['c-pay'] = function(){
  var d=findDeal(S.dealId),x=info(d),c=x.c;
  var amt=x.overdue.length?x.overdueAmt:x.next.amt;
  var first=c.name.split(' ')[0];
  function copyBtn(k,label){var on=S.copied===k;return '<button class="btn" style="min-height:52px;margin-top:16px;border-radius:14px;background:'+(on?'#E3F2EC':'#F0F0F3')+';color:'+(on?'#0B7A5C':'#1D1D1F')+'" data-act="copy" data-k="'+k+'">'+(on?ic('check','#0B7A5C',20,2.4)+'Скопировано':label)+'</button>';}
  var h=bar()+'<div class="wrap"><h1 class="t" style="font-size:30px">Как оплатить</h1><p class="sub" style="font-size:18px">Переведите <b style="color:#1D1D1F" class="num">'+money(amt)+'</b> за «'+esc(d.item)+'» любым удобным способом</p>';
  h+='<div class="card pad" style="margin-top:20px"><div style="display:flex;align-items:center;gap:14px"><div class="tile" style="width:48px;height:48px;background:#F0F0F3">'+ic('bank','#1D1D1F',24)+'</div><div><div style="font-size:20px;font-weight:700">Kuveyt Türk</div><div style="font-size:15px;color:#6E6E73">Перевод на карту или по IBAN</div></div></div>'+
    '<div style="margin-top:16px;font-size:14px;color:#6E6E73">Получатель</div><div style="font-size:18px;font-weight:600;margin-top:2px">[ИМЯ ВЛАДЕЛЬЦА]</div>'+
    '<div style="margin-top:12px;font-size:14px;color:#6E6E73">IBAN</div><div style="font-size:18px;font-weight:600;margin-top:2px;font-family:ui-monospace,Menlo,monospace">TR[IBAN ВЛАДЕЛЬЦА]</div>'+copyBtn('iban','Скопировать IBAN')+
    '<div style="margin-top:12px;font-size:15px;color:#6E6E73;line-height:1.4">В назначении укажите: <b style="color:#1D1D1F">'+esc(first)+' · '+esc(d.item)+'</b></div></div>';
  h+='<div class="card pad" style="margin-top:12px"><div style="display:flex;align-items:center;gap:14px"><div class="tile" style="width:48px;height:48px;background:#F0F0F3">'+ic('usdt','#1D1D1F',24)+'</div><div><div style="font-size:20px;font-weight:700">USDT</div><div style="font-size:15px;color:#6E6E73">Сеть TRC20 (Tron)</div></div></div>'+
    '<div style="margin-top:16px;font-size:14px;color:#6E6E73">Адрес кошелька</div><div style="font-size:17px;font-weight:600;margin-top:2px;font-family:ui-monospace,Menlo,monospace;word-break:break-all">[АДРЕС USDT-КОШЕЛЬКА]</div>'+copyBtn('wallet','Скопировать адрес')+
    '<div style="margin-top:12px;padding:12px 14px;border-radius:12px;background:#FFF1D6;color:#7A4100;font-size:15px;line-height:1.4">Отправляйте только USDT в сети TRC20. В другой сети деньги не дойдут.</div></div>';
  h+='<div class="lbl" style="margin-top:22px">Как вы оплатили?</div><div class="seg" role="group" aria-label="Способ оплаты"><button class="'+(S.method==='bank'?'on':'')+'" data-act="pick" data-m="bank" aria-pressed="'+(S.method==='bank')+'">Kuveyt Türk</button><button class="'+(S.method==='usdt'?'on':'')+'" data-act="pick" data-m="usdt" aria-pressed="'+(S.method==='usdt')+'">USDT</button></div>';
  h+='<button class="btn pri big" style="margin-top:14px" data-act="paid">Я оплатил</button></div>';
  return h;
};

SC['c-sent'] = function(){
  return '<div class="full" style="background:#fff">'+bar()+'<div style="flex:1;display:flex;flex-direction:column;padding:0 28px calc(28px + var(--bottom))"><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px">'+
    '<svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="46" fill="#E3F2EC"/><circle cx="48" cy="48" r="32" fill="#0B7A5C"/><path d="M34 49l9 9 19-20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
    '<h1 class="t" style="margin:8px 0 0">Спасибо!</h1><p style="margin:0;font-size:19px;line-height:1.45;color:#6E6E73;max-width:300px">Платёж отправлен на проверку. Как только продавец подтвердит, он появится в вашем графике.</p></div>'+
    '<button class="btn dark big" data-act="cHome">На главную</button></div></div>';
};

/* ---------- render & actions ---------- */
var view=document.getElementById('view'), toastEl=document.getElementById('toast'), tt=null;
function render(keep){
  var sc=view.querySelector('.scroll'), top=keep&&sc?sc.scrollTop:0;
  var cal=document.getElementById('cal'), calL=keep&&cal?cal.scrollLeft:null;
  var html=SC[S.screen]();
  var full=S.screen==='menu'||S.screen==='o-mark'||S.screen==='c-sent';
  var showTabs=S.role==='owner'&&S.screen!=='o-mark';
  view.innerHTML=(full?html:'<div class="scroll">'+html+'</div>')+(showTabs?tabs():'');
  var n=view.querySelector('.scroll');if(n)n.scrollTop=top;
  var c2=document.getElementById('cal');if(c2)c2.scrollLeft=calL!=null?calL:52*3;
}
function toast(t){
  toastEl.innerHTML=ic('check','#34C391',20,2.5)+'<span></span>';
  toastEl.lastChild.textContent=t;
  toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove('show');},2600);
}
function push(){S.stack.push({screen:S.screen,dealId:S.dealId,clientId:S.clientId});}
var A = {
  menu:function(){S.screen='menu';S.role=null;S.stack=[];render();},
  owner:function(){S.role='owner';S.tab='o-home';S.screen='o-home';S.stack=[];render();},
  clientRole:function(){S.role='client';S.screen='c-home';S.stack=[];render();},
  cHome:function(){S.screen='c-home';S.stack=[];render();},
  tab:function(e){S.tab=e.t;S.screen=e.t;S.stack=[];if(e.t==='o-new')S.form=newForm();render();},
  back:function(){var p=S.stack.pop();if(p){S.screen=p.screen;S.dealId=p.dealId;S.clientId=p.clientId;}render();},
  deal:function(e){push();S.dealId=e.id;S.screen=S.role==='client'?'c-deal':'o-deal';render();},
  cl:function(e){push();S.clientId=e.id;S.screen='o-client';render();},
  mark:function(){push();var x=info(findDeal(S.dealId));S.method=x.pend&&x.pend.method==='USDT'?'usdt':'bank';S.screen='o-mark';render();},
  pick:function(e){S.method=e.m;render(true);},
  confirmMark:function(){
    var d=findDeal(S.dealId),x=info(d);
    d.paid=Math.min(d.months,d.paid+1);
    S.pending=S.pending.filter(function(p){return p.dealId!==d.id;});
    A.back();toast('Записано: '+money(x.next.amt)+' · '+(S.method==='bank'?'Kuveyt Türk':'USDT'));
  },
  confirm:function(e){
    var p=S.pending.filter(function(q){return q.id===e.id;})[0];if(!p)return;
    var d=findDeal(p.dealId);d.paid=Math.min(d.months,d.paid+1);
    S.pending=S.pending.filter(function(q){return q.id!==e.id;});
    render(true);toast('Подтверждено: '+clientOf(d).name+' · '+money(p.amt));
  },
  remind:function(){var c=clientOf(findDeal(S.dealId));toast('Напоминание отправлено: '+c.name);},
  call:function(){var c=findClient(S.clientId);toast('Звонок: '+c.phone);},
  wa:function(){var c=findClient(S.clientId);toast('Откроется WhatsApp: '+c.name);},
  ask:function(){toast('Откроется чат с продавцом в WhatsApp');},
  pay:function(e){push();S.dealId=e.id;S.copied='';S.method='bank';S.screen='c-pay';render();},
  copy:function(e){
    var txt=e.k==='iban'?'TR[IBAN ВЛАДЕЛЬЦА]':'[АДРЕС USDT-КОШЕЛЬКА]';
    try{if(navigator.clipboard)navigator.clipboard.writeText(txt).catch(function(){});}catch(err){}
    S.copied=e.k;render(true);
  },
  paid:function(){
    var d=findDeal(S.dealId),x=info(d);
    S.pending=S.pending.filter(function(p){return p.dealId!==d.id;});
    S.pending.push({id:'p'+(++seq),dealId:d.id,amt:x.overdue.length?x.overdueAmt:x.next.amt,method:S.method==='bank'?'Kuveyt Türk':'USDT'});
    S.stack=[{screen:'c-home'}];S.screen='c-sent';render();
  },
  newFor:function(e){push();S.form=newForm(e.id);S.screen='o-new';render();},
  seg:function(e){S.form.mode=e.m;S.form.err='';render(true);},
  mk:function(e){S.form.markup=+e.v;render(true);},
  term:function(e){S.form.months=+e.v;render(true);},
  create:function(){
    var f=S.form,r=calc(f);
    if(f.mode==='new'&&!f.name.trim()){f.err='Укажите имя клиента';render(true);return;}
    if(!f.item.trim()){f.err='Укажите, какой товар покупает клиент';render(true);return;}
    if(r.cost<=0){f.err='Укажите себестоимость товара';render(true);return;}
    var p=String(f.date).split('-');if(p.length!==3){f.err='Укажите дату договора';render(true);return;}
    var c;
    if(f.mode==='new'){c={id:'c'+(++seq),name:f.name.trim(),phone:f.phone.trim(),deals:[]};CLIENTS.push(c);}
    else c=findClient(f.clientId);
    var d={id:'d'+(++seq),item:f.item.trim(),desc:f.desc.trim(),icon:guessIcon(f.item),cost:r.cost,sale:r.sale,months:f.months,start:[+p[0],+p[1]-1,+p[2]],paid:0};
    c.deals.push(d);
    S.form=null;S.tab='o-clients';S.clientId=c.id;S.stack=[{screen:'o-clients'},{screen:'o-client',clientId:c.id}];S.dealId=d.id;S.screen='o-deal';
    render();toast('Рассрочка оформлена. '+c.name.split(' ')[0]+' получит приглашение в Qist');
  }
};
view.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el||el.disabled)return;
  var fn=A[el.getAttribute('data-act')];if(fn)fn(el.dataset);
});
function onField(ev){
  var f=ev.target.getAttribute&&ev.target.getAttribute('data-f');if(!f||!S.form)return;
  S.form[f]=ev.target.value;
  if(S.form.err){S.form.err='';var er=view.querySelector('.err');if(er)er.remove();}
  updateSummary();
}
view.addEventListener('input',onField);
view.addEventListener('change',onField);
render();
})();
</script>
