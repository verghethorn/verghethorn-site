<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title></title><style>html,body{margin:0;background:#fff}</style></head><body><script>
try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){if(x.scope.indexOf('/magaam')>-1)x.unregister()})});
Object.keys(localStorage).forEach(function(k){if(k.indexOf('magaam')===0||k.indexOf('sb-')===0)localStorage.removeItem(k)});
Object.keys(sessionStorage).forEach(function(k){if(k.indexOf('magaam')===0)sessionStorage.removeItem(k)})}catch(e){}
</script></body></html>
